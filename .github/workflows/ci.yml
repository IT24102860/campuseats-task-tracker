name: CI

on:
  push:
    branches: [ "main", "feature/**", "chore/**", "fix/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: List repository files
        run: ls -la

      - name: Basic project check
        run: |
          echo "Running CI for CampusEats Task Tracker"
          test -f README.md && echo "README found"

      # Extended pipeline (optional part of Task 05): build and test the Node project
      - name: Set up Node.js
        if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Run tests
        if: hashFiles('package-lock.json') != ''
        run: npm test --if-present

      - name: Dependency security audit
        if: hashFiles('package-lock.json') != ''
        run: npm audit --audit-level=high
